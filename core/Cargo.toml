[package]
name = "gtacore"
version = "0.1.0"
edition = "2021"
description = "Fast native helpers for GTA 6 Clipper: live checks, MPEG-TS durations, Twitch chat hub"
license = "MIT"

[dependencies]
ureq = { version = "2.12", default-features = false, features = ["tls", "gzip"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
