# GTA 6 Clipper config. Edit, then run: ./gtaclip-run run
# API keys go in .env (see .env.example), never in this file.

[general]
output_dir = "clips"          # finished clips land in clips/<streamer>/<time>_<trigger>/
buffer_dir = "buffer"         # rolling live recording (auto-deleted)
buffer_minutes = 6            # how much live video is kept to cut clips from
segment_seconds = 4           # buffer chunk size
poll_seconds = 45             # how often offline streamers are fully probed (streamlink)
live_check_seconds = 20       # fast Rust page check of every streamer (needs core/ built)
quality = "720p60,720p,best"  # stream quality order (first available wins)
recorder = "browser"          # browser = headless Chrome captures the stream (Twitch; YouTube auto-falls back) | streamlink
max_recordings = 6            # max streams recorded at once (bandwidth/disk guard)
record_mode = "always"        # "always" = record any live stream, "gta_only" = only while category/title is GTA
clip_workers = 1              # keep at 1 so a render cannot starve live YouTube/Twitch recorders
dashboard_port = 8787

[edit]
caption_style = "gta"         # gta | bold | mrbeast | minimal
formats = ["vertical"]        # vertical (9:16 TikTok/Shorts/Reels) and/or landscape (16:9)
vertical_zoom = 1.0           # >1 zooms gameplay in the 9:16 frame (can crop the facecam)
words_per_caption = 3
hook_seconds = 3.5            # how long the AI hook text stays on top
progress_bar = true
watermark = true              # repo link in the lower-right corner of every clip
watermark_text = "github.com/byte4day/gta6-clipper"
loudnorm = true

[whisper]
# "auto" = Groq Whisper API if GROQ_API_KEY is set, else local faster-whisper (free, offline)
backend = "auto"
groq_model = "whisper-large-v3-turbo"
local_model = "base"          # tiny | base | small | medium | large-v3  (fallback if Groq is off)
language = ""                 # "" = auto-detect, or "en"

[llm]
# Tried in order; providers without a key in .env are skipped. All have free tiers.
providers = ["groq", "openrouter", "cerebras", "gemini", "mistral"]
ai_scan = true                # every scan_seconds: transcribe last 30s + chat, ask the LLM "is this clip-worthy?"
scan_seconds = 40
ai_min_score = 8              # 0-10, clip when the LLM scores >= this

[llm.models]
# All free-tier IDs. OpenRouter falls back across the :free list in llm.py.
groq = "openai/gpt-oss-20b"                        # Groq free (fast); alt: qwen/qwen3.8-27b
openrouter = "baidu/ernie-5.5-flash-preview:free"  # OpenRouter :free (reliable JSON)
cerebras = "llama-3.3-70b"                         # Cerebras free tier
gemini = "gemini-2.5-flash"                        # Google AI Studio free
mistral = "mistral-small-latest"                   # Mistral free tier

[detect]
cooldown_seconds = 45         # min gap between auto clips of one streamer
first_moment_seconds = 75     # length of the "stream just started" clip
gta6_open_seconds = 90        # length of the "first time opening GTA 6" clip
gta_pattern = "grand theft auto vi|grand theft auto 6|gta ?vi\\b|gta ?6"
chat_spike_ratio = 3.0        # chat msgs/sec vs normal baseline
chat_spike_min_rate = 4.0     # ignore spikes slower than this (msgs/sec)
audio_spike_db = 12.0        # loudness jump above the running average (scream / hype)
hype_words = ["clip it", "clip that", "clipped", "no way", "omg", "lmao", "kekw", "omegalul", "pog", "w ", "holy", "insane", "gta 6", "bro what"]

[pre_post]                     # seconds before/after the trigger peak
chat_spike = [22, 10]          # center on chat peak, keep a bit of aftermath
audio_spike = [16, 10]
ai_moment = [14, 10]           # AI returns peak_at; keep clip tight around it
manual = [35, 5]

[socials]
# Connect YouTube / TikTok / Instagram in Settings → Socials (OAuth on localhost).
# App client id/secret go in .env; tokens land in state/socials.json.
auto_upload = true            # push every finished clip to connected accounts
platforms = ["youtube", "tiktok", "instagram"]
privacy = "public"            # YouTube: public | unlisted | private
tiktok_privacy = "private"    # private (SELF_ONLY, works unaudited) | public | friends

