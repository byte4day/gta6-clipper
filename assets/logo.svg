<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>GTA 6 Clipper</title>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a0f3d"/>
      <stop offset="1" stop-color="#0b0911"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23d"/>
      <stop offset=".45" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#ff3ea5"/>
    </linearGradient>
    <linearGradient id="vi" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffe3f1"/>
    </linearGradient>
    <!-- retro sun with horizontal cuts in its lower half -->
    <mask id="cuts">
      <rect width="512" height="512" fill="#fff"/>
      <rect x="0" y="262" width="512" height="7" fill="#000"/>
      <rect x="0" y="286" width="512" height="10" fill="#000"/>
      <rect x="0" y="312" width="512" height="13" fill="#000"/>
      <rect x="0" y="340" width="512" height="16" fill="#000"/>
    </mask>
    <!-- the "clip": a diagonal cut through the VI, upper half slides along the cut -->
    <clipPath id="above"><polygon points="0,0 512,0 512,206 0,322"/></clipPath>
    <clipPath id="below"><polygon points="0,336 512,220 512,512 0,512"/></clipPath>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#sky)"/>
    <circle cx="256" cy="268" r="150" fill="url(#sun)" mask="url(#cuts)"/>
    <!-- horizon glow -->
    <rect x="0" y="392" width="512" height="120" fill="#0b0911"/>
    <rect x="0" y="388" width="512" height="6" fill="#ff3ea5" opacity=".9"/>
  </g>

  <!-- VI, drawn as shapes (no font needed), italic, sliced like a clip -->
  <g transform="translate(16 0) skewX(-9) translate(0 0)">
    <g clip-path="url(#above)"><g transform="translate(9 -4)">
      <g transform="translate(10 12)" fill="#0b0911" opacity=".85"><polygon points="120,150 190,150 236,300 282,150 352,150 276,372 196,372"/><rect x="362" y="150" width="64" height="222"/></g>
      <g fill="url(#vi)"><polygon points="120,150 190,150 236,300 282,150 352,150 276,372 196,372"/><rect x="362" y="150" width="64" height="222"/></g>
    </g></g>
    <g clip-path="url(#below)"><g transform="translate(0 0)">
      <g transform="translate(10 12)" fill="#0b0911" opacity=".85"><polygon points="120,150 190,150 236,300 282,150 352,150 276,372 196,372"/><rect x="362" y="150" width="64" height="222"/></g>
      <g fill="url(#vi)"><polygon points="120,150 190,150 236,300 282,150 352,150 276,372 196,372"/><rect x="362" y="150" width="64" height="222"/></g>
    </g></g>
  </g>

  <!-- viewfinder corners = clipper -->
  <g fill="none" stroke="#ffffff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 132 V58 H132"/>
    <path d="M380 58 H454 V132"/>
    <path d="M454 380 V454 H380"/>
    <path d="M132 454 H58 V380"/>
  </g>
  <!-- REC dot -->
  <circle cx="98" cy="98" r="14" fill="#ff2d55"/>
</svg>
