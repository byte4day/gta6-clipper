<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 120" width="1000" height="120" role="img" aria-label="The dashboard">
<style>@font-face{font-family:'Anton';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Bebas';src:url(data:font/woff2;base64,) format('woff2');}
.bar{transform-box:fill-box;transform-origin:left;animation:wipe 1s cubic-bezier(.7,0,.2,1) both}
@keyframes wipe{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.t{animation:slide .8s cubic-bezier(.2,.9,.2,1.15) .25s both}
.s{animation:fadein .8s ease .55s both}
@keyframes slide{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.sweep{animation:sweep 3.6s ease-in-out 1.2s infinite}
@keyframes sweep{0%{transform:translateX(-200px)}60%,100%{transform:translateX(1200px)}}
.dot{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs>
  <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff3ea5"/><stop offset=".6" stop-color="#ff8a3d"/><stop offset="1" stop-color="#ff8a3d" stop-opacity="0"/></linearGradient>
  <linearGradient id="sw" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="barc"><rect x="0" y="104" width="1000" height="6"/></clipPath>
</defs>
<g class="s"><circle class="dot" cx="9" cy="20" r="6" fill="#ff3ea5"/>
<text x="24" y="28" font-family="Bebas" font-size="24" letter-spacing="5" fill="#ff8a3d">MISSION 03 · YOUR HIDEOUT</text></g>
<g class="t" transform="skewX(-8)">
  <text x="12" y="92" font-family="Anton" font-size="62" fill="#000" opacity=".35" transform="translate(4 4)">THE DASHBOARD</text>
  <text x="12" y="92" font-family="Anton" font-size="62" fill="#fff" stroke="#120b1c" stroke-width="2" paint-order="stroke">THE DASHBOARD</text>
</g>
<rect class="bar" x="0" y="104" width="1000" height="6" rx="3" fill="url(#g)"/>
<g clip-path="url(#barc)"><rect class="sweep" x="0" y="104" width="160" height="6" fill="url(#sw)"/></g>
</svg>