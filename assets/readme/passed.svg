<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 220" width="1000" height="220" role="img" aria-label="Mission passed! Respect plus. Clips ready before the stream ends.">
<style>@font-face{font-family:'Anton';src:url(data:font/woff2;base64,) format('woff2');}@font-face{font-family:'Bebas';src:url(data:font/woff2;base64,) format('woff2');}
.mp{transform-box:fill-box;transform-origin:center;animation:pop 6s cubic-bezier(.2,1.4,.3,1) infinite}
@keyframes pop{0%{opacity:0;transform:scale(1.8)}10%,80%{opacity:1;transform:scale(1)}92%,100%{opacity:0;transform:scale(1)}}
.rs{animation:rs 6s ease infinite}
@keyframes rs{0%,14%{opacity:0;transform:translateY(16px)}22%,80%{opacity:1;transform:none}92%,100%{opacity:0}}
.band{transform-box:fill-box;transform-origin:center;animation:band 6s ease infinite}
@keyframes band{0%{transform:scaleY(0)}6%,86%{transform:scaleY(1)}96%,100%{transform:scaleY(0)}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<defs><linearGradient id="band" x1="0" x2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset=".2" stop-color="#000" stop-opacity=".72"/><stop offset=".8" stop-color="#000" stop-opacity=".72"/><stop offset="1" stop-color="#000" stop-opacity="0"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe680"/><stop offset=".6" stop-color="#ffd23d"/><stop offset="1" stop-color="#e09a1a"/></linearGradient></defs>
<rect class="band" x="0" y="30" width="1000" height="160" fill="url(#band)"/>
<text class="mp" x="500.0" y="122" text-anchor="middle" font-family="Anton" font-size="84" fill="url(#gold)" stroke="#000" stroke-width="5" paint-order="stroke">MISSION PASSED!</text>
<g class="rs"><text x="500.0" y="168" text-anchor="middle" font-family="Bebas" font-size="34" letter-spacing="4" fill="#fff" stroke="#000" stroke-width="3" paint-order="stroke">RESPECT +   ·   CLIPS READY BEFORE THE STREAM ENDS</text></g>
</svg>