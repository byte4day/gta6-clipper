<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GTA 6 Clipper</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
@font-face { font-family: Anton; src: url(/fonts/Anton-Regular.ttf); }
@font-face { font-family: Montserrat; src: url(/fonts/Montserrat.ttf); font-weight: 100 900; }
@font-face { font-family: Bebas; src: url(/fonts/BebasNeue-Regular.ttf); }
@font-face { font-family: Luckiest; src: url(/fonts/LuckiestGuy-Regular.ttf); }
:root {
  --bg: #0b0911; --panel: #15111c; --panel2: #1d1726; --line: #2a2236; --line2: #3a3049; --text: #f4eefb; --mute: #9d90b0; --dim: #6d6280;
  --pink: #ff3ea5; --orange: #ff8a3d; --violet: #8a5cff; --live: #ff2d55; --ok: #3ddc97; --warn: #ffc53d;
  --grad: linear-gradient(90deg, var(--pink), var(--orange));
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 Montserrat, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
button { font: 800 13px Montserrat, sans-serif; border: 0; border-radius: 10px; padding: 9px 13px; cursor: pointer; background: var(--grad); color: #fff; }
button:hover { filter: brightness(1.06); }
button:disabled { background: #2a2236; color: var(--dim); cursor: not-allowed; filter: none; }
button.ghost { background: #241d2f; color: var(--text); } button.ghost:hover { background: #2e2540; }
button.sm { padding: 6px 10px; font-size: 12px; border-radius: 8px; }
button.danger { background: #3a1420; color: #ff7a93; }
button:focus-visible, .who:focus-visible { outline: 2px solid var(--pink); outline-offset: 2px; }
a { color: var(--orange); }
input, select, textarea { font: 600 13px Montserrat, sans-serif; background: #0f0b16; color: var(--text); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; min-width: 0; width: 100%; }
textarea { resize: vertical; line-height: 1.4; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--pink); outline-offset: -1px; }
.mute { color: var(--mute); } .small { font-size: 12px; color: var(--mute); }
.row { display: flex; align-items: center; gap: 10px; } .between { justify-content: space-between; } .wrap { flex-wrap: wrap; } .grow { flex: 1; min-width: 0; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .spacer { flex: 1; }

header { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 24px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.logo { display: flex; align-items: center; gap: 10px; }
.mark { width: 42px; height: 42px; display: block; }
.by { font: 700 10px Montserrat, sans-serif; letter-spacing: 2px; text-transform: uppercase; color: var(--mute); margin-top: 3px; }
h1 { font: 28px/1 Anton, Impact, sans-serif; margin: 0; letter-spacing: 1px; color: var(--pink); }
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-weight: 700; font-size: 12px; color: var(--mute); }
.chip b { color: var(--text); font-size: 14px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.dot.live { background: var(--live); } .dot.ok { background: var(--ok); }

main { padding: 22px 24px 80px; display: grid; gap: 34px; max-width: 1680px; margin: 0 auto; }
main > *, .cols > * { min-width: 0; }
h2 { font: 24px Anton, Impact, sans-serif; letter-spacing: .5px; margin: 0; font-weight: 400; }
.shead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; } .shead .small { font-weight: 600; }

.av { position: relative; width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font: 800 15px Montserrat, sans-serif; color: #fff; background: linear-gradient(135deg, var(--violet), var(--pink)); overflow: hidden; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.av.off { filter: grayscale(1) brightness(.55); }
.ring { padding: 3px; border-radius: 50%; background: #2a2236; flex: none; } .ring .av { border: 2px solid var(--bg); }
.ring.live { background: var(--live); }
.ring.rec { outline: 2px solid var(--orange); outline-offset: 1px; }

.roster { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 8px; scrollbar-width: thin; }
.who { display: grid; justify-items: center; gap: 6px; width: 82px; flex: none; text-align: center; cursor: pointer; background: none; padding: 0; color: inherit; font: inherit; border-radius: 12px; }
.who:hover { filter: none; } .who:hover .n { color: var(--pink); }
.who .ring .av { width: 62px; height: 62px; font-size: 22px; }
.who .n { font-weight: 700; font-size: 12px; max-width: 82px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.who .s { font-size: 10px; font-weight: 800; letter-spacing: .5px; color: var(--dim); text-transform: uppercase; margin-top: -4px; }
.who.live .s { color: var(--live); } .who.dis { opacity: .35; }
.divider { width: 1px; background: var(--line); flex: none; margin: 8px 6px 26px; }

.tiles { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); }
.tile { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; display: grid; }
.tile:hover { border-color: var(--line2); } .tile.rec { border-color: #4a2036; }
.screen { position: relative; aspect-ratio: 16/9; background: #000; overflow: hidden; }
.tile.rec .screen { cursor: pointer; }
.screen img.pv { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.screen .shade { position: absolute; inset: 0; background: linear-gradient(180deg, #0009 0%, transparent 28%, transparent 55%, #000d 100%); pointer-events: none; }
.screen .tl, .screen .tr { position: absolute; top: 10px; display: flex; gap: 6px; flex-wrap: wrap; } .screen .tl { left: 10px; } .screen .tr { right: 10px; justify-content: flex-end; }
.screen .bl { position: absolute; left: 12px; right: 12px; bottom: 10px; display: flex; align-items: center; gap: 10px; }
.screen .play { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; }
.screen:hover .play { opacity: 1; }
.play span { width: 62px; height: 62px; border-radius: 50%; background: #ff3ea5e0; display: grid; place-items: center; font-size: 24px; }
.screen .idle { position: absolute; inset: 0; padding: 30px 0 62px; display: grid; place-items: center; text-align: center; gap: 10px; align-content: center; color: var(--mute); font-weight: 700; background: #120e19; }
.screen .idle .av { width: 56px; height: 56px; font-size: 22px; margin: 0 auto; }
.pill { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: #000a; color: #fff; white-space: nowrap; letter-spacing: .3px; }
.pill.live { background: var(--live); } .pill.gta { background: var(--grad); } .pill.ad { background: var(--warn); color: #000; }
.pill.ok { background: #13392b; color: var(--ok); } .pill.soft { background: #2a2236; color: var(--mute); }
.tname { font-weight: 800; font-size: 15px; text-shadow: 0 1px 6px #000; } .tcat { font-size: 12px; color: #ddd; text-shadow: 0 1px 4px #000; }
.tbody { padding: 12px 14px 14px; display: grid; gap: 10px; }
.spark { width: 100%; height: 34px; display: block; }
.events { font: 11px/1.55 ui-monospace, SFMono-Regular, monospace; color: var(--mute); max-height: 52px; overflow: hidden; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

.cols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 28px; align-items: start; }
.feed { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 6px 0; max-height: 640px; overflow: auto; position: sticky; top: 90px; }
.fi { display: flex; gap: 10px; padding: 9px 14px; align-items: flex-start; font-size: 12px; border-bottom: 1px solid #ffffff08; }
.fi .av { width: 26px; height: 26px; font-size: 11px; } .fi time { color: var(--dim); font: 11px ui-monospace, monospace; }

.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.filters input { width: 230px; } .filters select { width: 170px; }
.fchip { background: #1d1726; color: var(--mute); padding: 7px 11px; font-size: 12px; border-radius: 99px; border: 1px solid var(--line); }
.fchip.on { background: #2a1424; color: var(--text); border-color: var(--pink); }
.clips { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.clip { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: grid; align-content: start; cursor: pointer; }
.clip:hover { border-color: var(--line2); }
.clip.new { border-color: var(--pink); }
.cv { position: relative; aspect-ratio: 9/16; background: #000; }
.cv img, .cv video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cv .badges { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; justify-content: space-between; gap: 6px; }
.proc { position: absolute; inset: 0; display: grid; place-items: center; align-content: center; gap: 10px; color: var(--mute); font-weight: 700; text-align: center; padding: 14px; background: #120e19; }
.spin { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #ffffff1a; border-top-color: var(--pink); animation: spin .9s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
.cb { padding: 10px 12px 12px; display: grid; gap: 6px; }
.cb .t { font-weight: 800; font-size: 13px; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cb .av { width: 20px; height: 20px; font-size: 9px; }
.del { background: none; padding: 2px 4px; font-size: 14px; border-radius: 6px; opacity: .45; flex: none; }
.del:hover { background: #3a1420; opacity: 1; filter: none; } .clip:hover .del { opacity: .9; }
.empty { color: var(--mute); padding: 34px; border: 1px dashed var(--line2); border-radius: 16px; text-align: center; grid-column: 1 / -1; line-height: 1.7; }

.modal { position: fixed; inset: 0; z-index: 60; display: none; place-items: center; background: #05030acc; padding: 20px; }
.modal.show { display: grid; }
.sheet { background: var(--panel); border: 1px solid var(--line2); border-radius: 18px; width: min(1180px, 100%); max-height: calc(100vh - 40px); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.mhead { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.live-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 0; overflow: auto; }
.player { background: #000; position: relative; aspect-ratio: 16/9; } .player video { width: 100%; height: 100%; display: block; }
.player .note { position: absolute; inset: 0; display: grid; place-items: center; color: var(--mute); font-weight: 700; pointer-events: none; }
.chatbox { border-left: 1px solid var(--line); display: grid; grid-template-rows: auto 1fr; min-height: 0; max-height: min(72vh, 680px); }
.chatlog { overflow: auto; padding: 8px 12px; font-size: 13px; line-height: 1.45; overflow-wrap: anywhere; } .chatlog div { padding: 2px 0; }
.livebar { padding: 12px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
.clip-grid { display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 1fr); min-height: 0; overflow: hidden; }
.clip-grid .vid { background: #000; display: grid; place-items: center; }
.clip-grid video { width: 100%; max-height: calc(100vh - 120px); aspect-ratio: 9/16; background: #000; display: block; }
.editor { padding: 16px 18px 22px; overflow: auto; display: grid; gap: 12px; align-content: start; max-height: calc(100vh - 110px); }
label.f { display: grid; gap: 5px; font-size: 12px; color: var(--mute); font-weight: 700; }
.box { background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }
.styles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.sty { border: 2px solid var(--line); border-radius: 10px; padding: 12px 4px 8px; text-align: center; cursor: pointer; background: #0f0b16; color: #fff; text-shadow: -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000; font-size: 19px; }
.sty.on { border-color: var(--pink); background: #2a1424; }
.sty span { display: block; font: 700 10px Montserrat, sans-serif; color: var(--mute); text-shadow: none; margin-top: 6px; }
.transcript { font-size: 13px; color: #d8cfe6; line-height: 1.55; max-height: 150px; overflow: auto; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 12px; } .kv b { color: var(--mute); font-weight: 700; }

#scrim { position: fixed; inset: 0; background: #0008; opacity: 0; pointer-events: none; z-index: 70; }
#drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(580px, 100vw); background: var(--panel); border-left: 1px solid var(--line); transform: translateX(100%); z-index: 80; display: grid; grid-template-rows: auto auto 1fr; }
body.drawer #drawer { transform: none; } body.drawer #scrim { opacity: 1; pointer-events: auto; }
.dhead { display: flex; align-items: center; padding: 18px 20px 6px; } .dhead h2 { flex: 1; }
.tabs { display: flex; gap: 6px; padding: 8px 20px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.tabs button { background: transparent; color: var(--mute); padding: 8px 12px; } .tabs button.on { background: #2a2236; color: var(--text); }
.dbody { overflow: auto; padding: 16px 20px 40px; display: grid; gap: 12px; align-content: start; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.check { display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; } .check input { width: auto; accent-color: var(--pink); }
.srow { display: flex; align-items: center; gap: 10px; background: var(--panel2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }

#toast { position: fixed; bottom: 18px; left: 50%; transform: translate(-50%, 0); background: #2a2236; border: 1px solid var(--line2); padding: 11px 16px; z-index: 99; border-radius: 12px; opacity: 0; pointer-events: none; font-weight: 700; max-width: calc(100vw - 32px); }
#toast.show { opacity: 1; }

.ic { width: 1.15em; height: 1.15em; flex: none; display: inline-block; vertical-align: -.2em; }
button, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; }
.btn { font: 800 13px Montserrat, sans-serif; border-radius: 10px; padding: 9px 13px; color: #fff; background: var(--grad); }
button.ghost, .btn.ghost { background: #241d2f; border: 1px solid var(--line); color: var(--text); }
.icon-only { padding: 9px 10px; } .icon-only .ic { width: 18px; height: 18px; }
a.small { display: inline-flex; align-items: center; gap: 4px; text-decoration: none; } a.small:hover { text-decoration: underline; }
h2 { display: flex; align-items: center; gap: 10px; font-size: 24px; }
h2 .hic { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; background: #2a2236; color: var(--pink); }
h2 .hic .ic { width: 16px; height: 16px; vertical-align: 0; }
.who .ring .av { width: 62px; height: 62px; }
.pill { display: inline-flex; align-items: center; gap: 5px; } .pill .ic { width: 12px; height: 12px; vertical-align: 0; }
.recdot { width: 7px; height: 7px; border-radius: 50%; background: #fff; display: inline-block; }
.play .ic { width: 26px; height: 26px; margin-left: 3px; }
.fchip { display: inline-flex; gap: 6px; align-items: center; } .fchip .ic { width: 14px; height: 14px; }
.del { color: var(--mute); } .del .ic { width: 16px; height: 16px; } .del:hover { color: #ff8aa0; }
.tabs button .ic { width: 16px; height: 16px; }
.proc .ic { width: 30px; height: 30px; color: var(--warn); margin: 0 auto; }
* { scrollbar-width: thin; scrollbar-color: #3a3049 transparent; }
::-webkit-scrollbar { width: 10px; height: 10px; } ::-webkit-scrollbar-thumb { background: #3a3049; border-radius: 99px; border: 2px solid var(--bg); }

@media (max-width: 1100px) { .cols { grid-template-columns: 1fr; } .feed { position: static; max-height: 360px; } }
@media (max-width: 860px) { .live-grid, .clip-grid { grid-template-columns: 1fr; } .chatbox { border-left: 0; border-top: 1px solid var(--line); max-height: 300px; }
  .editor { max-height: none; } .sheet { overflow: auto; } .clip-grid { overflow: visible; } .clip-grid video { max-height: 60vh; } }
@media (max-width: 560px) { header, main { padding-left: 16px; padding-right: 16px; } h1 { font-size: 22px; } .tiles { grid-template-columns: 1fr; }
  .clips { grid-template-columns: repeat(2, 1fr); } .styles { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; }
  .modal { padding: 0; } .sheet { border-radius: 0; max-height: 100vh; height: 100vh; } .filters input, .filters select { width: 100%; } }
</style>
</head>

<header>
  <div class="logo"><img class="mark" src="/logo.svg" alt=""><div><h1>GTA 6 CLIPPER</h1><div class="by">by Numan Hayder</div></div></div>
  <div class="chips">
    <span class="chip"><span class="dot" id="d-live"></span><b id="s-live">0</b>online</span>
    <span class="chip"><span class="dot" id="d-rec"></span><b id="s-rec">0</b>recording</span>
    <span class="chip"><svg class="ic" aria-hidden="true"><use href="#i-scissors"/></svg><b id="s-clips">0</b>clips</span>
    <span class="chip" id="s-llm">AI …</span>
    <span class="chip" id="s-core" title="Rust core: fast live checks, segment timing, one chat socket">…</span>
  </div>
  <div class="spacer"></div>
  <button class="ghost" id="b-notify" onclick="toggleNotify()" title="Desktop alerts for new clips"><svg class="ic" aria-hidden="true"><use href="#i-bell-off"/></svg>Alerts off</button>
  <a class="btn ghost icon-only" href="https://github.com/byte4day/gta6-clipper" target="_blank" rel="noopener" title="GitHub repository" aria-label="GitHub repository"><svg class="ic" aria-hidden="true"><use href="#i-github"/></svg></a>
  <button onclick="openDrawer()"><svg class="ic" aria-hidden="true"><use href="#i-sliders"/></svg>Settings &amp; API keys</button>
</header>

<main>
  <section>
    <div class="shead"><h2><span class="hic"><svg class="ic" aria-hidden="true"><use href="#i-users"/></svg></span>WHO'S ONLINE</h2><span class="small" id="roster-note"></span></div>
    <div class="roster" id="roster"></div>
  </section>
  <section>
    <div class="shead"><h2><span class="hic"><svg class="ic" aria-hidden="true"><use href="#i-radio"/></svg></span>LIVE NOW</h2><span class="small">previews refresh every 4 s · click a preview to watch with live chat</span></div>
    <div class="tiles" id="tiles"></div>
  </section>
  <div class="cols">
    <section>
      <div class="shead"><h2><span class="hic"><svg class="ic" aria-hidden="true"><use href="#i-scissors"/></svg></span>CLIPS</h2><span class="small" id="clip-note"></span></div>
      <div class="filters">
        <input id="f-q" placeholder="Search title, hashtag, words…" oninput="CLIPS_HTML='';renderClips()">
        <select id="f-s" onchange="CLIPS_HTML='';renderClips()"><option value="">All streamers</option></select>
        <div class="row wrap" id="f-t"></div>
      </div>
      <div class="clips" id="clips"></div>
    </section>
    <aside>
      <div class="shead"><h2><span class="hic"><svg class="ic" aria-hidden="true"><use href="#i-activity"/></svg></span>ACTIVITY</h2></div>
      <div class="feed" id="feed"></div>
    </aside>
  </div>
</main>

<div class="modal" id="m-live" onclick="if(event.target===this)closeLive()">
  <div class="sheet">
    <div class="mhead" id="live-head"></div>
    <div class="live-grid">
      <div>
        <div class="player"><video id="live-video" muted autoplay playsinline controls></video><div class="note" id="live-note">connecting…</div></div>
        <div class="livebar">
          <span class="small row" style="font-weight:800;gap:6px"><svg class="ic" aria-hidden="true"><use href="#i-scissors"/></svg>Clip the last</span>
          <button class="sm" onclick="clipLive(15)">15s</button><button class="sm" onclick="clipLive(30)">30s</button>
          <button class="sm" onclick="clipLive(60)">60s</button><button class="sm" onclick="clipLive(90)">90s</button>
          <div class="spacer"></div>
          <button class="ghost sm" onclick="const v=$('#live-video');v.muted=!v.muted;this.innerHTML=v.muted?ICON_UNMUTE:ICON_MUTE"><svg class="ic" aria-hidden="true"><use href="#i-mute"/></svg>Unmute</button>
        </div>
        <div style="padding:12px 16px 14px"><div class="small" style="font-weight:700;margin-bottom:4px">Chat activity (last 2 min)</div>
          <svg class="spark" id="live-spark" viewBox="0 0 300 40" preserveAspectRatio="none"></svg>
          <div class="events" id="live-events" style="max-height:90px;margin-top:8px"></div></div>
      </div>
      <div class="chatbox"><div class="mhead" style="padding:10px 12px"><b class="grow">Live chat</b><span class="small" id="live-rate"></span></div><div class="chatlog" id="chatlog"></div></div>
    </div>
  </div>
</div>

<div class="modal" id="m-clip" onclick="if(event.target===this)closeClip()">
  <div class="sheet"><div class="mhead" id="clip-head"></div><div class="clip-grid"><div class="vid" id="clip-vid"></div><div class="editor" id="clip-ed"></div></div></div>
</div>

<div id="scrim" onclick="closeDrawer()"></div>
<aside id="drawer" aria-label="Settings">
  <div class="dhead"><h2>SETTINGS</h2><button class="ghost" onclick="closeDrawer()"><svg class="ic" aria-hidden="true"><use href="#i-x"/></svg>Close</button></div>
  <div class="tabs">
    <button data-tab="keys" onclick="tab('keys')"><svg class="ic" aria-hidden="true"><use href="#i-key"/></svg>API keys</button>
    <button data-tab="socials" onclick="tab('socials')"><svg class="ic" aria-hidden="true"><use href="#i-share"/></svg>Socials</button>
    <button data-tab="streamers" onclick="tab('streamers')"><svg class="ic" aria-hidden="true"><use href="#i-tv"/></svg>Streamers</button>
    <button data-tab="clips" onclick="tab('clips')"><svg class="ic" aria-hidden="true"><use href="#i-film"/></svg>Clips &amp; recording</button>
  </div>
  <div class="dbody" id="dbody"></div>
</aside>
<div id="toast" role="status"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.remove("show"), 2600); };
const LABEL = {stream_start: "Stream start", gta6_open: "First GTA 6", chat_spike: "Chat peak", audio_spike: "Loud moment", ai_moment: "AI moment", manual: "Manual"};
const TICON = {stream_start: "radio", gta6_open: "palm", chat_spike: "chat", audio_spike: "volume", ai_moment: "sparkles", manual: "scissors"};
const ic = n => `<svg class="ic" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const lab = k => ic(TICON[k] || "scissors") + esc(LABEL[k] || k);
const ICON_MUTE = ic("volume") + "Mute", ICON_UNMUTE = ic("mute") + "Unmute";
const PROV = {groq: "Groq", openrouter: "OpenRouter", cerebras: "Cerebras", gemini: "Google Gemini", mistral: "Mistral"};
const STY = {gta: ["Bebas", "#ff3ea5", "GTA"], bold: ["Anton", "#ffe500", "Bold"], mrbeast: ["Luckiest", "#39ff14", "MrBeast"], minimal: ["Montserrat", "#fff266", "Minimal"]};
const STATUS_TXT = {transcribing: "Writing captions…", writing: "AI is writing the title…", rendering: "Rendering video…"};

async function api(path, method = "POST", body) {
  const r = await fetch(path, {method, headers: {"Content-Type": "application/json", "X-Clipper": "1"}, body: body ? JSON.stringify(body) : undefined});
  const j = await r.json().catch(() => ({msg: "error " + r.status}));
  if (j.msg) toast(j.msg);
  return j;
}
const avatar = (key, name, cls = "", has = true) =>
  `<div class="av ${cls}">${esc((name || "?").replace("@", "")[0].toUpperCase())}${has ? `<img src="/avatar/${esc(key)}" alt="" loading="lazy" onerror="this.remove()">` : ""}</div>`;
const since = s => s.live_since || s.online_since;
const dur = t => { if (!t) return ""; const m = Math.floor((Date.now() / 1000 - t) / 60); return m >= 60 ? `${Math.floor(m / 60)}h ${m % 60}m` : `${m}m`; };
const ago = iso => { const s = (Date.now() - new Date(iso)) / 1000; return s < 60 ? "just now" : s < 3600 ? `${Math.floor(s / 60)}m ago` : s < 86400 ? `${Math.floor(s / 3600)}h ago` : new Date(iso).toLocaleDateString(); };
const hue = s => [...String(s)].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
function sparkPath(vals, w = 300, h = 40) {
  if (!vals || vals.length < 2) return `<text x="150" y="25" text-anchor="middle" fill="#6d6280" font-size="11">collecting chat data…</text>`;
  const mx = Math.max(1, ...vals), step = w / (vals.length - 1);
  const pts = vals.map((v, i) => `${(i * step).toFixed(1)},${(h - 3 - (v / mx) * (h - 8)).toFixed(1)}`);
  return `<path d="M0,${h} L${pts.join(" L")} L${w},${h} Z" fill="#ff3ea522"/><polyline points="${pts.join(" ")}" fill="none" stroke="#ff3ea5" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
}


/* ---------- tiny DOM morph: update only what changed (no flicker, images keep loading) ---------- */
function morph(a, b) {
  if (a.nodeType !== b.nodeType || a.nodeName !== b.nodeName || (a.id || "") !== (b.id || "")) { a.replaceWith(b); return; }
  if (a.nodeType === 3 || a.nodeType === 8) { if (a.nodeValue !== b.nodeValue) a.nodeValue = b.nodeValue; return; }
  if (a.nodeType !== 1) return;
  for (const at of [...a.attributes]) if (!b.hasAttribute(at.name)) a.removeAttribute(at.name);
  for (const at of [...b.attributes]) {
    if (at.name === "src" && a.tagName === "IMG" && a.classList.contains("pv") && a.getAttribute("src")) continue;  // previews swap themselves
    if (a.getAttribute(at.name) !== at.value) a.setAttribute(at.name, at.value);
  }
  morphKids(a, b);
}
function morphKids(a, b) {
  const want = [...b.childNodes];
  want.forEach((nb, i) => {
    let cur = a.childNodes[i];
    if (nb.id) { const m = a.querySelector(`:scope > [id="${CSS.escape(nb.id)}"]`); if (m && m !== cur) { a.insertBefore(m, cur || null); cur = m; } }
    if (!cur) a.appendChild(nb); else morph(cur, nb);
  });
  while (a.childNodes.length > want.length) a.lastChild.remove();
}
function setHTML(el, html) { const t = document.createElement("div"); t.innerHTML = html; morphKids(el, t); }
/* ---------- status, roster, live tiles, activity ---------- */
let ST = {streamers: [], llm: [], recording: 0}, TILES_HTML = "", ROSTER_HTML = "", FEED_HTML = "", CLIPS_HTML = "", PV = {};
function refreshPreviews() {  // preload the newest frame off-screen, then swap: no flicker
  if (document.hidden) return;
  for (const s of ST.streamers) {
    if (!(s.recording && s.preview)) continue;
    const url = `/preview/${s.key}.jpg?t=${Date.now()}`, im = new Image();
    im.onload = () => { PV[s.key] = url; document.querySelectorAll(`img.pv[data-k="${s.key}"]`).forEach(x => x.src = url);
      document.querySelectorAll(`.idle[data-k="${s.key}"]`).length && (TILES_HTML = "", status()); };
    im.src = url;
  }
}
async function status() {
  if (document.hidden) return;
  try { ST = await (await fetch("/api/status")).json(); } catch (e) { return; }
  const all = ST.streamers, online = all.filter(s => s.live), off = all.filter(s => !s.live);
  $("#s-live").textContent = online.length; $("#d-live").className = "dot" + (online.length ? " live" : "");
  $("#s-rec").textContent = ST.recording; $("#d-rec").className = "dot" + (ST.recording ? " live" : "");
  $("#s-core").innerHTML = ST.core ? `<span class="dot ok"></span>Rust core` : `<span class="dot"></span>Python mode`;
  $("#s-llm").innerHTML = ST.llm.length ? `<span class="dot ok"></span>AI: ${esc(ST.llm.join(" → "))}` : `<span class="dot"></span>AI: add a key in Settings`;
  $("#roster-note").textContent = `${online.length} online · ${off.length} offline`;
  const who = s => `<button id="who-${esc(s.key)}" class="who ${s.live ? "live" : ""} ${s.enabled ? "" : "dis"}" title="${esc(s.live ? s.title : s.status)}" onclick="${s.recording ? `openLive('${esc(s.key)}')` : s.live ? `document.getElementById('tile-${esc(s.key)}')?.scrollIntoView({block:'nearest'})` : `openDrawer('streamers')`}">
      <div class="ring ${s.live ? "live" : ""} ${s.recording ? "rec" : ""}">${avatar(s.key, s.name, s.live ? "" : "off", s.avatar)}</div>
      <div class="n">${esc(s.name)}</div><div class="s">${s.live ? "● " + (dur(since(s)) || "live") : s.enabled ? "offline" : "paused"}</div></button>`;

async function loadClips() {

  const isNew = new Set(CLIPS.filter(c => c._new).map(c => c.dir));
  const done = d.filter(c => c.status === "done");
  if (KNOWN) for (const c of done) if (!KNOWN.has(c.dir)) {
    toast(`New clip: ${c.title || c.streamer}`); isNew.add(c.dir);

  }

  document.title = (d.some(c => c._new) ? "● " : "") + "GTA 6 Clipper";
  const sig = JSON.stringify(d.map(c => [c.dir, c.status, c.title, c.rendered, c._new, c.uploads]));
  if (sig === lastSig) return; lastSig = sig;
  const names = [...new Set(d.map(c => c.streamer))].sort(), cur = $("#f-s").value;

}
function renderClips() {

      <div class="cv">${ready ? `<img src="/files/${dir}/thumb.jpg?v=${v}" alt="" loading="lazy">`

/* ---------- live player + chat ---------- */
let LIVE = null, HLS = null, CHAT_T = 0, CHAT_TIMER = null;
const loadHls = () => window.Hls ? Promise.resolve() : new Promise((ok, no) => { const s = document.createElement("script");
  s.src = "https://cdn.jsdelivr.net/npm/hls.js@1.5.17/dist/hls.min.js"; s.onload = ok; s.onerror = no; document.head.appendChild(s); });
async function openLive(key) {
  if (LIVE) closeLive();
  LIVE = key; CHAT_T = 0; $("#chatlog").innerHTML = '<div class="mute">waiting for chat…</div>';
  const note = $("#live-note"); note.textContent = "connecting…"; note.style.display = "";
  updateLiveHead(); $("#m-live").classList.add("show");
  const v = $("#live-video"), src = `/live/${key}/index.m3u8`;

  if (window.Hls && Hls.isSupported()) {
    HLS = new Hls({liveSyncDurationCount: 2, manifestLoadingRetryDelay: 1500, manifestLoadingMaxRetry: 20});

    HLS.on(Hls.Events.ERROR, (e, d) => { if (d.fatal) { note.style.display = ""; note.textContent = "buffering, retrying…";

async function pollChat() {

        `<label class="check"><input type="checkbox" ${targets.has(p) ? "checked" : ""} onchange="toggleSocialTarget('${p}',this.checked)">${esc(p)}</label>`).join("")}</div>
      <div class="two"><label class="f">YouTube privacy<select onchange="setOpt('socials','privacy',this.value)">
        ${["public","unlisted","private"].map(v => `<option value="${v}" ${priv===v?"selected":""}>${v}</option>`).join("")}</select></label>
        <label class="f">TikTok privacy<select onchange="setOpt('socials','tiktok_privacy',this.value)">
        ${[["private","private (works unaudited)"],["friends","friends"],["public","public"]].map(([v,l]) => `<option value="${v}" ${ttPriv===v?"selected":""}>${l}</option>`).join("")}</select></label></div></div>
    ${(S.platforms || []).map(p => `<div class="box">
      <div class="row between"><b>${esc(p.label)}</b><span class="pill ${p.connected ? "ok" : "soft"}">${p.connected ? ic("check") + esc(p.account || "connected") : "not connected"}</span></div>
      <div class="two"><label class="f">Client id / key<input id="sid-${p.id}" placeholder="${p.client_id_masked || "paste client id"}" autocomplete="off"></label>
        <label class="f">Client secret<input type="password" id="ssec-${p.id}" placeholder="${p.has_app ? "paste to replace" : "paste secret"}" autocomplete="off"></label></div>
      <div class="actions">
        <button class="sm" onclick="saveSocialApp('${p.id}')">Save app</button>
        <button class="sm" onclick="connectSocial('${p.id}')" ${p.has_app || p.client_id_masked ? "" : "disabled"}>Connect</button>
        ${p.connected ? `<button class="danger sm" onclick="disconnectSocial('${p.id}')">Disconnect</button>` : ""}
        <a class="small" href="${esc(p.docs)}" target="_blank" rel="noopener">Create app${ic("external")}</a>
      </div>
      <div class="small">${p.id === "youtube" ? "Enable YouTube Data API v3 · OAuth Desktop or Web client · redirect URI above." :
        p.id === "tiktok" ? "TikTok Content Posting API must be approved on your developer app." :
        "Meta app with Instagram Graph · Instagram must be Business/Creator linked to a Facebook Page."}</div>
    </div>`).join("")}`;
}
async function saveSocialApp(id) {
  const client_id = $("#sid-" + id).value.trim(), client_secret = $("#ssec-" + id).value.trim();
  if (!client_id && !client_secret) return toast("paste a client id / secret");
  const body = {platform: id};
  if (client_id) body.client_id = client_id;
  if (client_secret) body.client_secret = client_secret;
  await api("/api/socials/creds", "POST", body);
  refreshTab();
}
async function connectSocial(id) {
  const j = await api("/api/socials/connect", "POST", {platform: id});
  if (!(j.ok && j.url)) return;
  window.open(j.url, "gtaclip-oauth", "width=560,height=720");
  toast("finish login in the popup, then come back");
  let n = 0;
  const poll = setInterval(async () => {
    n += 1; await loadSettings();
    const p = (SET.socials?.platforms || []).find(x => x.id === id);
    if (p?.connected || n >= 40) { clearInterval(poll); if (TAB === "socials") tab("socials"); if (p?.connected) toast(p.account ? `connected · ${p.account}` : `${id} connected`); }
  }, 1500);
}
async function disconnectSocial(id) { if (confirm(`Disconnect ${id}?`)) { await api(`/api/socials/${id}/disconnect`); refreshTab(); } }
async function toggleSocialTarget(p, on) {
  const cur = new Set(SET.socials.targets || []);
  on ? cur.add(p) : cur.delete(p);
  if (!cur.size) return toast("keep at least one platform");
  await setOpt("socials", "platforms", [...cur]);
}

function keysTab() {
  return `<div class="small">Keys are saved to <b>.env</b> on this computer only and work right away, no restart. Clips use the first provider that works, top to bottom — all defaults are <b>free-tier</b> models. OpenRouter stays on <code>:free</code> models only. A Groq key also turns on fast cloud Whisper captions.</div>` +
    SET.providers.map(p => `<div class="box">
      <div class="row between"><b>${esc(PROV[p.id] || p.id)}</b><span class="pill ${p.has_key ? "ok" : "soft"}">${p.has_key ? ic("check") + "key " + esc(p.masked) : "no key"}</span></div>
      <div class="two"><label class="f">API key<input type="password" id="k-${p.id}" placeholder="${p.has_key ? "paste to replace" : "paste key"}" autocomplete="off"></label><label class="f">Model<input id="m-${p.id}" value="${esc(p.model)}"></label></div>
      <div class="actions"><button class="sm" onclick="saveKey('${p.id}')">Save</button><button class="ghost sm" onclick="api('/api/test/${p.id}')">Test</button>
        ${p.has_key ? `<button class="danger sm" onclick="removeKey('${p.id}')">Remove</button>` : ""}<a class="small" href="${esc(p.get_key)}" target="_blank" rel="noopener">Get a free key${ic("external")}</a></div></div>`).join("");
}
async function saveKey(id) {
  const key = $("#k-" + id).value.trim(), model = $("#m-" + id).value.trim(), body = {provider: id, model};
  if (key) body.key = key;
  const j = await api("/api/keys", "POST", body);
  if (j.ok && key) await api("/api/test/" + id);
  refreshTab(); status();
}
async function removeKey(id) { if (confirm(`Remove the ${PROV[id]} key?`)) { await api("/api/keys", "POST", {provider: id, key: ""}); refreshTab(); status(); } }

function streamersTab() {
  const st = Object.fromEntries(ST.streamers.map(s => [s.key, s]));
  return `<div class="box"><b>Add a streamer</b>
      <div class="row"><select id="add-plat" style="width:130px"><option value="twitch">Twitch</option><option value="youtube">YouTube</option></select>
        <input id="add-name" placeholder="xqc  ·  @IShowSpeed  ·  channel link" onkeydown="if(event.key==='Enter')addStreamer()"></div>
      <button onclick="addStreamer()">+ Add &amp; start watching</button></div>
    <div style="display:grid;gap:8px">${SET.streamers.map(s => { const w = st[s.key] || {};
      return `<div class="srow"><div class="ring ${w.live ? "live" : ""}">${avatar(s.key, s.name, w.live ? "" : "off", w.avatar)}</div>
        <div class="grow"><b>${esc(s.name.replace("@", ""))}</b><div class="small">${esc(s.platform)} · ${w.recording ? "recording" : w.live ? "online" : s.enabled ? "offline" : "paused"}</div></div>
        <button class="ghost sm" onclick="toggleStreamer('${esc(s.key)}')">${s.enabled ? "Pause" : "Enable"}</button>
        <button class="danger sm" onclick="removeStreamer('${esc(s.key)}','${esc(s.name)}')">Remove</button></div>`; }).join("")}</div>`;
}
async function addStreamer() {
  const name = $("#add-name").value.trim().replace(/\/(live|videos|featured|streams)\/?$/i, ""); if (!name) return;
  const plat = /youtube\.com|^@/i.test(name) ? "youtube" : /twitch\.tv/i.test(name) ? "twitch" : $("#add-plat").value;
  const j = await api("/api/streamers", "POST", {platform: plat, name});
  if (j.ok) setTimeout(() => { refreshTab(); status(); }, 400);
}
async function toggleStreamer(k) { await api(`/api/streamers/${k}/toggle`); refreshTab(); status(); }
async function removeStreamer(k, n) { if (confirm(`Stop watching ${n}?`)) { await api(`/api/streamers/${k}`, "DELETE"); refreshTab(); status(); } }

function clipsTab() {
  const s = SET.settings, c = SET.choices;
  const sel = (sec, k, labels = {}) => `<select onchange="setOpt('${sec}','${k}',this.value)">${c[sec][k].map(v => `<option value="${esc(v)}" ${s[sec][k] === v ? "selected" : ""}>${esc(labels[v] || v)}</option>`).join("")}</select>`;
  const num = (sec, k, step = 1) => `<input type="number" step="${step}" value="${esc(s[sec][k])}" onchange="setOpt('${sec}','${k}',this.value)">`;
  const fmts = s.edit.formats || [];
  return `<div class="box"><b>Default caption design</b><div class="styles">${styleCards(s.edit.caption_style, "setStyle")}</div>
      <div class="two"><label class="f">Words per caption${num("edit", "words_per_caption")}</label><label class="f">Gameplay zoom (vertical)${num("edit", "vertical_zoom", 0.05)}</label></div>
      <div class="row wrap"><label class="check"><input type="checkbox" ${fmts.includes("vertical") ? "checked" : ""} onchange="setFormat('vertical',this.checked)">9:16 vertical</label>
        <label class="check"><input type="checkbox" ${fmts.includes("landscape") ? "checked" : ""} onchange="setFormat('landscape',this.checked)">16:9 landscape</label></div>
      <div class="row wrap"><label class="check"><input type="checkbox" ${s.edit.watermark !== false ? "checked" : ""} onchange="setOpt('edit','watermark',this.checked)">GitHub link in the lower corner</label>
        <label class="check"><input type="checkbox" ${s.edit.progress_bar !== false ? "checked" : ""} onchange="setOpt('edit','progress_bar',this.checked)">Progress bar</label></div></div>
    <div class="box"><b>Recording</b><div class="two">
      <label class="f">Record with${sel("general", "recorder", {browser: "Headless browser (Chrome)", streamlink: "Streamlink"})}</label>
      <label class="f">Quality${sel("general", "quality", {"1080p60,best": "1080p60", "720p60,720p,best": "720p60", "480p,best": "480p (saves data)", best: "Best available"})}</label>
      <label class="f">Record${sel("general", "record_mode", {always: "Any live stream", gta_only: "Only while playing GTA"})}</label>
      <label class="f">Max streams at once${num("general", "max_recordings")}</label></div>
      <div class="small">Recorder and quality changes apply to the next recording that starts. YouTube always uses streamlink (its web player has no HLS).</div></div>
    <div class="box"><b>AI moment finder</b>
      <label class="check"><input type="checkbox" ${s.llm.ai_scan ? "checked" : ""} onchange="setOpt('llm','ai_scan',this.checked)">Let AI watch transcript + chat for clip-worthy moments</label>
      <div class="two"><label class="f">Clip when AI score ≥ (0-10)${num("llm", "ai_min_score")}</label><label class="f">Check every (seconds)${num("llm", "scan_seconds")}</label></div></div>
    <div class="box"><b>Whisper captions</b><div class="two">
      <label class="f">Engine${sel("whisper", "backend", {auto: "Auto (Groq if key, else local)", groq: "Groq API", local: "Local (free, offline)"})}</label>
      <label class="f">Local model size${sel("whisper", "local_model")}</label></div>
      <label class="f">Language (blank = auto)<input value="${esc(s.whisper.language || "")}" placeholder="en" onchange="setOpt('whisper','language',this.value)"></label></div>
    <div class="box"><b>Moment detection</b><div class="two">
      <label class="f">Chat spike (× normal)${num("detect", "chat_spike_ratio", 0.5)}</label><label class="f">Loudness jump (dB)${num("detect", "audio_spike_db", 0.5)}</label>
      <label class="f">Cooldown between clips (s)${num("detect", "cooldown_seconds")}</label><label class="f">Stream-start clip length (s)${num("detect", "first_moment_seconds")}</label></div></div>`;
}
async function setOpt(sec, k, v) { await api("/api/settings", "POST", {[sec]: {[k]: v}}); refreshTab(); }
function setStyle(k) { setOpt("edit", "caption_style", k); }
async function setFormat(f, on) { const fm = new Set(SET.settings.edit.formats || []); on ? fm.add(f) : fm.delete(f); await setOpt("edit", "formats", [...fm]); }

const whenVisible = fn => () => { if (!document.hidden) fn(); };
setNotifyBtn(); status().then(refreshPreviews); loadClips();
setInterval(whenVisible(status), 2500); setInterval(whenVisible(loadClips), 4000); setInterval(whenVisible(refreshPreviews), 5000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { status(); loadClips(); } });
</script>
</body>
</html>
